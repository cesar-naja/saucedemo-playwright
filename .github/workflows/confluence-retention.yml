name: Confluence results retention
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'
      timezone: 'America/Chicago'

permissions:
  contents: read

jobs:
  prune-results:
    if: ${{ vars.CONFLUENCE_PAGE_ID != '' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: confluence-results
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Remove expired result rows
      run: node scripts/publish-confluence.mjs
      env:
        CONFLUENCE_CLEANUP_ONLY: 'true'
        CONFLUENCE_API_BASE: ${{ vars.CONFLUENCE_API_BASE }}
        CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_PAGE_ID }}
        CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
        CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
